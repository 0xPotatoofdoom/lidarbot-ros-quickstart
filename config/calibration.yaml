# Odometry scale corrections applied by tools/odom_calibrator.py before the EKF.
# true motion / reported motion. Measure with:
#   ./record run calib-angular ./ros python3 /work/tools/calibrate.py angular 2
#   ./record run calib-linear  ./ros python3 /work/tools/calibrate.py linear 1.0
# 1.0 = no correction. Values outside 0.5-2.0 are rejected.
#
# Measured 2026-11-16 in the kitchen with firmware/lidarbot_base (phase 2). Rotation: against
# lidar scan alignment, 1 x 360 deg each way. Distance: against a tape on the floor, read by the
# camera panned 90 deg right (tape at the image centre before and after), 0.9 m out and back.
# Our own lidar decoding over-reads range differences by only 0.6-1.0% (Yahboom's: 3%).
odom_calibrator:
  ros__parameters:
    linear_scale: 0.990          # tape: 36.25 in out, 36.06 in back; /odom_raw pose 0.929, 0.926 m
    angular_scale_left: 1.008    # CCW, /odom_raw pose: 1.0083
    angular_scale_right: 1.005   # CW,  /odom_raw pose: 1.0047
    imu_yaw_scale: 1.001         # /imu yaw: 1.0010, 1.0000
#
# With Yahboom's original firmware (measured 2026-11-11 on hardwood, 2 x 720 deg turns, tape
# 39.0 in out and back) the values were: linear 0.982, angular left 0.997, right 0.996,
# imu yaw 1.001. Use those if the board is flashed back to Yahboom's firmware.
